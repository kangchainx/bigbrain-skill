interface:
  display_name: "Bigbrain"
  short_description: "Opt-in Claude collaboration for the current chat; new chats default off."
  long_description: |
    Activate only after the user explicitly opts in for this chat. Complexity,
    repeated failures and discussion of Bigbrain do not authorize activation.
    Codex executes; the advisor directs. Within an enabled chat, Bigbrain scores the task, and
    escalates when the score crosses a configurable threshold -- large
    features, multi-file changes, refactors across module boundaries,
    ambiguous requirements, migrations, security or concurrency work, or a
    task that has already failed twice. User feedback that the same issue
    still fails requirements triggers immediate advisor diagnosis, even after DONE.

    On escalation the advisor returns the global acceptance criteria and a set
    of milestones, each with its own steps and criteria. The executor works one
    milestone at a time and reports it for review. The loop cannot end on
    status=done alone: every acceptance criterion must be marked met, or the
    run continues. When the executor is stuck it hands over the failure and
    gets a different approach rather than a restatement.

    When the loop ends -- done, blocked, or out of rounds -- Bigbrain runs a
    retrospective, saves the lessons to a user-level store that is injected
    into future advisor requests, and writes a report with the token counts,
    an estimate of the run's cost, and the estimated saving versus sending
    everything to the premium model.

    Bigbrain never creates or modifies an AGENTS.md or any global Codex/Claude
    configuration file; lessons apply only while the skill is active.

    Select Claude Code CLI with setup --claude-code; it uses the existing Claude
    login and read-only repository tools. The legacy API backend requires
    BIGBRAIN_BASE_URL and BIGBRAIN_API_KEY. Run scripts/check_config.py --no-call
    first. Show role-labelled Claude planning/review/acceptance and Codex execution
    updates based on actual evidence, never private chain-of-thought.
  default_prompt: "For code review, Codex reviews first and then asks whether the user wants Claude second review; never call Claude for review without explicit consent for that scope. After explicit user opt-in, enable Bigbrain only for this chat with mode on. Then load lessons, verify the backend and follow the milestone loop. Honor mode off immediately; do not activate merely because Bigbrain was mentioned."
  icon: null
  category: "developer-tools"

policy:
  allow_implicit_invocation: false
